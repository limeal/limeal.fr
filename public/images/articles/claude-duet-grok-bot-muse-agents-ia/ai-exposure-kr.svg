<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">LLM 사용 경험 추정치</title>
  <desc id="desc">LLM을 거의 접하지 않은 단계부터 연구소 내부 시스템 접근까지 네 가지 대략적인 경험 수준입니다.</desc>
  <defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".08"/></pattern></defs>
  <rect width="1200" height="660" rx="28" fill="#111013"/>
  <rect width="1200" height="660" rx="28" fill="url(#dots)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="64" y="36" width="1072" height="116" rx="18" fill="#242326"/>
    <text x="600" y="85" fill="#fff" font-size="38" font-weight="700">≈ 6B</text>
    <text x="600" y="124" fill="#fbd52b" font-size="20">LLM을 거의 접해 보지 않음</text>
    <rect x="64" y="188" width="1072" height="116" rx="18" fill="#242326"/>
    <text x="600" y="237" fill="#fff" font-size="38" font-weight="700">≈ 1–2B</text>
    <text x="600" y="276" fill="#fbd52b" font-size="20">챗봇을 가끔 사용함</text>
    <rect x="64" y="340" width="1072" height="116" rx="18" fill="#242326"/>
    <text x="600" y="389" fill="#fff" font-size="38" font-weight="700">≈ 20M</text>
    <text x="600" y="428" fill="#fbd52b" font-size="20">업무에서 최고 성능 모델을 사용함</text>
    <rect x="64" y="492" width="1072" height="116" rx="18" fill="#242326"/>
    <text x="600" y="541" fill="#fff" font-size="38" font-weight="700">≈ 5K</text>
    <text x="600" y="580" fill="#fbd52b" font-size="20">연구소 내부 시스템에 접근함</text>
  </g>
</svg>
