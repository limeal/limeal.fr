<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Grok Bot, Muse, Dots and Claude Duet around an agent loop, with the human on the loop</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbd52b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbd52b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,0.07)"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="rgba(255,255,255,0.5)"/>
    </marker>
  </defs>
  <style>
    text { font-family: Satoshi, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .node { fill: #ffffff; font-size: 30px; font-weight: 800; }
    .maker { fill: rgba(255,255,255,0.55); font-size: 20px; }
  </style>

  <rect width="1200" height="630" fill="#111013"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="600" cy="315" r="300" fill="url(#glow)"/>

  <!-- Links from the products to the loop -->
  <g stroke="rgba(255,255,255,0.16)" stroke-width="2" fill="none">
    <path d="M300 150 C420 170 470 230 520 260"/>
    <path d="M900 150 C780 170 730 230 680 260"/>
    <path d="M300 480 C420 460 470 400 520 370"/>
    <path d="M900 480 C780 460 730 400 680 370"/>
  </g>

  <!-- Harness (dashed, lime) around the agent loop -->
  <circle cx="600" cy="315" r="150" fill="none" stroke="#fbd52b" stroke-width="3" stroke-dasharray="10 10" opacity="0.75"/>
  <path d="M600 210 A105 105 0 1 1 599.9 210" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="600" cy="315" r="40" fill="#1d1c1f" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <g fill="#ff007f">
    <circle cx="588" cy="306" r="5"/>
    <circle cx="612" cy="306" r="5"/>
    <rect x="584" y="322" width="32" height="6" rx="3"/>
  </g>

  <!-- Human on the harness -->
  <circle cx="600" cy="165" r="34" fill="#111013"/>
  <circle cx="600" cy="152" r="11" fill="#fbd52b"/>
  <path d="M581 186 C581 170 590 165 600 165 C610 165 619 170 619 186 Z" fill="#fbd52b"/>

  <!-- Products -->
  <g text-anchor="middle">
    <rect x="160" y="100" width="280" height="96" rx="20" fill="#1d1c1f" stroke="rgba(255,255,255,0.12)"/>
    <text class="node" x="300" y="148">Grok Bot</text>
    <text class="maker" x="300" y="178">xAI</text>

    <rect x="760" y="100" width="280" height="96" rx="20" fill="#1d1c1f" stroke="rgba(255,255,255,0.12)"/>
    <text class="node" x="900" y="148">Muse</text>
    <text class="maker" x="900" y="178">Meta</text>

    <rect x="160" y="432" width="280" height="96" rx="20" fill="#1d1c1f" stroke="rgba(255,255,255,0.12)"/>
    <text class="node" x="300" y="480">Dots</text>
    <text class="maker" x="300" y="510">OpenAI</text>

    <rect x="760" y="432" width="280" height="96" rx="20" fill="#1d1c1f" stroke="rgba(255,255,255,0.12)"/>
    <text class="node" x="900" y="480">Claude Duet</text>
    <text class="maker" x="900" y="510">Anthropic</text>
  </g>
</svg>
