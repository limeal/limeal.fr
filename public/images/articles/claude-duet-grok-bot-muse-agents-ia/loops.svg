<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d">
  <title id="t">Human in, on and outside the loop</title>
  <desc id="d">In the loop: the human sits inside the agent's loop and checks every output. On the loop: the human manages the harness around the loop. Outside the loop: the human only owns the why, agents own the how. After Kief Morris, martinfowler.com.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="rgba(255,255,255,0.45)"/>
    </marker>
    <!-- Human: head + shoulders, drawn around (0,0) -->
    <g id="human">
      <circle cx="0" cy="-9" r="7" fill="#fbd52b"/>
      <path d="M-12 12 C-12 2 -6 -1 0 -1 C6 -1 12 2 12 12 Z" fill="#fbd52b"/>
    </g>
  </defs>
  <style>
    text { font-family: Satoshi, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #ffffff; font-size: 16px; font-weight: 800; letter-spacing: 0.06em; }
    .agent { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .note { fill: rgba(255,255,255,0.6); font-size: 13px; }
    .human { fill: #fbd52b; font-size: 13px; font-weight: 700; }
    .src { fill: rgba(255,255,255,0.4); font-size: 12px; }
  </style>
  <rect width="800" height="340" rx="16" fill="#111013"/>

  <!-- Panel separators -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <line x1="266" y1="30" x2="266" y2="290"/>
    <line x1="533" y1="30" x2="533" y2="290"/>
  </g>

  <!-- IN THE LOOP: the human is a gate on the loop itself -->
  <text class="title" x="133" y="44" text-anchor="middle">IN THE LOOP</text>
  <path d="M133 110 A62 62 0 1 1 132.9 110" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="0" />
  <text class="agent" x="133" y="177" text-anchor="middle">agent</text>
  <use href="#human" x="133" y="110"/>
  <rect x="113" y="88" width="40" height="40" rx="20" fill="none" stroke="#fbd52b" stroke-width="2"/>
  <text class="note" x="133" y="268" text-anchor="middle">checks every output</text>

  <!-- ON THE LOOP: the human manages the harness around the loop -->
  <text class="title" x="400" y="44" text-anchor="middle">ON THE LOOP</text>
  <circle cx="400" cy="172" r="88" fill="none" stroke="#fbd52b" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>
  <path d="M400 110 A62 62 0 1 1 399.9 110" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="agent" x="400" y="177" text-anchor="middle">agent</text>
  <rect x="372" y="72" width="56" height="24" rx="12" fill="#111013"/>
  <use href="#human" x="400" y="84"/>
  <text class="human" x="496" y="98">harness</text>
  <text class="note" x="400" y="290" text-anchor="middle">improves the harness</text>

  <!-- OUTSIDE THE LOOP: the human owns the why, agents own the how -->
  <text class="title" x="666" y="44" text-anchor="middle">OUTSIDE THE LOOP</text>
  <path d="M686 120 A62 62 0 1 1 685.9 120" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="agent" x="686" y="181" text-anchor="middle">agents</text>
  <text class="note" x="686" y="200" text-anchor="middle">how</text>
  <use href="#human" x="580" y="92"/>
  <text class="human" x="580" y="128" text-anchor="middle">why</text>
  <line x1="600" y1="100" x2="630" y2="120" stroke="rgba(255,255,255,0.45)" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="note" x="666" y="268" text-anchor="middle">sets the goal only</text>

  <text class="src" x="780" y="326" text-anchor="end">After Kief Morris, martinfowler.com (2026)</text>
</svg>
