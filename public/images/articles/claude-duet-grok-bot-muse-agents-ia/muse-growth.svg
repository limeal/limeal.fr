<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-labelledby="t d">
  <title id="t">Average day-over-day download growth after launch</title>
  <desc id="d">Muse, 2026-09-08 to 2026-09-17: 55%. ChatGPT, first 10 days: 24%. Source: Sensor Tower via TechCrunch.</desc>
  <style>
    text { font-family: Satoshi, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .label { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .sub { fill: rgba(255,255,255,0.6); font-size: 12px; font-variant-numeric: tabular-nums; }
    .value { fill: #ffffff; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tick { fill: rgba(255,255,255,0.4); font-size: 12px; font-variant-numeric: tabular-nums; }
    .src { fill: rgba(255,255,255,0.4); font-size: 12px; }
  </style>
  <rect width="800" height="230" rx="16" fill="#111013"/>

  <!-- Scale: baseline x=180, 9 px per percentage point (0–60%) -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="270" y1="30" x2="270" y2="170"/>
    <line x1="360" y1="30" x2="360" y2="170"/>
    <line x1="450" y1="30" x2="450" y2="170"/>
    <line x1="540" y1="30" x2="540" y2="170"/>
    <line x1="630" y1="30" x2="630" y2="170"/>
    <line x1="720" y1="30" x2="720" y2="170"/>
  </g>
  <line x1="180" y1="30" x2="180" y2="170" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <g class="tick" text-anchor="middle">
    <text x="180" y="190">0%</text>
    <text x="360" y="190">20%</text>
    <text x="540" y="190">40%</text>
    <text x="720" y="190">60%</text>
  </g>

  <!-- Bars anchored on the baseline, 4px rounded data end only -->
  <path d="M180 46 H671 A4 4 0 0 1 675 50 V82 A4 4 0 0 1 671 86 H180 Z" fill="#fbd52b"/>
  <path d="M180 112 H392 A4 4 0 0 1 396 116 V148 A4 4 0 0 1 392 152 H180 Z" fill="#6f6d75"/>

  <text class="label" x="160" y="66" text-anchor="end">Muse</text>
  <text class="sub" x="160" y="83" text-anchor="end">09-08 → 09-17</text>
  <text class="label" x="160" y="132" text-anchor="end">ChatGPT</text>
  <text class="sub" x="160" y="149" text-anchor="end">day 1 → 10</text>

  <text class="value" x="687" y="73">55%</text>
  <text class="value" x="408" y="139">24%</text>

  <text class="src" x="780" y="216" text-anchor="end">Sensor Tower via TechCrunch</text>
</svg>
