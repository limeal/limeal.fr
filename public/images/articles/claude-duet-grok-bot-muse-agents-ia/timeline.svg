<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="t d">
  <title id="t">Always-on agent launches, 2026</title>
  <desc id="d">Grok Bot on 2026-08-11, Muse on 2026-09-08, Dots on 2026-09-29, Claude Duet on 2026-10-21.</desc>
  <style>
    text { font-family: Satoshi, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { fill: #ffffff; font-size: 17px; font-weight: 700; }
    .maker { fill: rgba(255,255,255,0.6); font-size: 13px; }
    .date { fill: rgba(255,255,255,0.6); font-size: 13px; font-variant-numeric: tabular-nums; }
    .tick { fill: rgba(255,255,255,0.4); font-size: 12px; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="800" height="240" rx="16" fill="#111013"/>

  <!-- Axis: 2026-08-01 (x=60) to 2026-11-01 (x=740), 7.39 px per day -->
  <line x1="60" y1="140" x2="740" y2="140" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  <g stroke="rgba(255,255,255,0.25)" stroke-width="2">
    <line x1="60" y1="134" x2="60" y2="146"/>
    <line x1="289.1" y1="134" x2="289.1" y2="146"/>
    <line x1="510.9" y1="134" x2="510.9" y2="146"/>
    <line x1="740" y1="134" x2="740" y2="146"/>
  </g>
  <g class="tick" text-anchor="middle">
    <text x="60" y="215">2026-08</text>
    <text x="289.1" y="215">2026-09</text>
    <text x="510.9" y="215">2026-10</text>
    <text x="740" y="215">2026-11</text>
  </g>

  <!-- Launches: lime marker with a 2px surface ring -->
  <g fill="#fbd52b" stroke="#111013" stroke-width="2">
    <circle cx="133.9" cy="140" r="8"/>
    <circle cx="340.9" cy="140" r="8"/>
    <circle cx="496.1" cy="140" r="8"/>
    <circle cx="658.7" cy="140" r="8"/>
  </g>
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1">
    <line x1="133.9" y1="96" x2="133.9" y2="128"/>
    <line x1="340.9" y1="96" x2="340.9" y2="128"/>
    <line x1="496.1" y1="96" x2="496.1" y2="128"/>
    <line x1="658.7" y1="96" x2="658.7" y2="128"/>
  </g>

  <g text-anchor="middle">
    <text class="name" x="133.9" y="68">Grok Bot</text>
    <text class="maker" x="133.9" y="86">xAI</text>
    <text class="date" x="133.9" y="170">2026-08-11</text>

    <text class="name" x="340.9" y="68">Muse</text>
    <text class="maker" x="340.9" y="86">Meta</text>
    <text class="date" x="340.9" y="170">2026-09-08</text>

    <text class="name" x="496.1" y="68">Dots</text>
    <text class="maker" x="496.1" y="86">OpenAI</text>
    <text class="date" x="496.1" y="170">2026-09-29</text>

    <text class="name" x="658.7" y="68">Claude Duet</text>
    <text class="maker" x="658.7" y="86">Anthropic</text>
    <text class="date" x="658.7" y="170">2026-10-21</text>
  </g>
</svg>
