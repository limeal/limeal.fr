<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">LLM exposure estimates</title>
  <desc id="desc">Four approximate figures, shown from broadest to narrowest: 6 billion, 1 to 2 billion, 20 million, and 5,000.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#111013"/>
  <rect width="1200" height="560" rx="28" fill="url(#dots)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="64" y="148" width="1072" height="84" rx="18" fill="#242326"/>
    <text x="600" y="204" fill="#fff" font-size="40" font-weight="700">≈ 6B</text>

    <rect x="64" y="302" width="1072" height="84" rx="18" fill="#242326"/>
    <text x="600" y="358" fill="#fff" font-size="40" font-weight="700">≈ 1–2B</text>

    <rect x="64" y="454" width="1072" height="80" rx="18" fill="#242326"/>
    <text x="600" y="507" fill="#fff" font-size="38" font-weight="700">≈ 20M</text>
    <rect x="64" y="554" width="1072" height="80" rx="18" fill="#242326"/>
    <text x="600" y="607" fill="#fff" font-size="38" font-weight="700">≈ 5K</text>
  </g>
</svg>
